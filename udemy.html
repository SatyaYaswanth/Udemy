<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Udemy Clone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body { background: #ffffff; }

  header {
    background: #1c1d1f;
    padding: 18px 40px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -1px;
  }

  .logo span {
    background: #a435f0;
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 32px;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .nav-right a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
  }

  .nav-right a:hover {
    color: #a435f0;
  }

  .cards {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    padding: 60px 20px;
  }

  .card {
    background: #f7f9fa;
    border: 1px solid #d1d7dc;
    border-radius: 10px;
    width: 340px;
    padding: 25px;
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  /* .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  } */

  .thumb {
    width: 100%;
    height: 180px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    margin-bottom: 18px;
    color: #fff;
  }

  .thumb.dev { background: linear-gradient(135deg,#1c1d1f,#3a3b3d); }
  .thumb.design { background: linear-gradient(135deg,#a435f0,#6a1fb0); }
  .thumb.business { background: linear-gradient(135deg,#00a1d9,#026c96); }

  .card h3 {
    font-size: 18px;
    color: #1c1d1f;
    margin-bottom: 4px;
    text-align: left;
  }

  .card p.instructor {
    font-size: 13px;
    color: #6a6f73;
    text-align: left;
    margin-bottom: 6px;
  }

  .rating {
    text-align: left;
    font-size: 13px;
    color: #b4690e;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .rating span { color: #6a6f73; font-weight: 400; }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d7dc;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 14px;
    outline: none;
  }

  input[type="text"]:focus { border-color: #a435f0; }

  .enroll-btn {
    width: 100%;
    padding: 12px 0;
    border: none;
    border-radius: 6px;
    background: #a435f0;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .enroll-btn:hover { background: #8710d8; }
</style>
</head>
<body>

  <header>
    <div class="logo">udemy</div>
    <div class="nav-right">
      <a href="#">search</a>
      <a href="#">my courses</a>
    </div>
  </header>

  <div class="cards">

    <div class="card">
      <div class="thumb dev">💻</div>
      <h3>The Complete Web Development Bootcamp</h3>
      <p class="instructor">By Dr. Angela Yu</p>
      <div class="rating">4.7 ★ <span>(320,540 ratings)</span></div>
      <input type="text" placeholder="enter coupon code">
      <button class="enroll-btn">enroll now</button>
    </div>

    <div class="card">
      <div class="thumb design">🎨</div>
      <h3>UI / UX Design Masterclass</h3>
      <p class="instructor">By Daniel Walter Scott</p>
      <div class="rating">4.6 ★ <span>(112,890 ratings)</span></div>
      <input type="text" placeholder="enter coupon code">
      <button class="enroll-btn">enroll now</button>
    </div>

    <div class="card">
      <div class="thumb business">📈</div>
      <h3>Business Analytics & Excel for Beginners</h3>
      <p class="instructor">By Maven Analytics</p>
      <div class="rating">4.8 ★ <span>(78,210 ratings)</span></div>
      <input type="text" placeholder="enter coupon code">
      <button class="enroll-btn">enroll now</button>
    </div>

  </div>

</body>
</html>
